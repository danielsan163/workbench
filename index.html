<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workbench">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Workbench</title>
</head>
<body>
<main id="view"></main>

<nav id="tabs" aria-label="Sections">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    <span>Projects</span>
  </a>
  <a href="#/shop" data-tab="shop">
    <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11h10.8L20.5 7H6.4"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
    <span>Shopping</span><b class="tab-badge" id="badge-shop"></b>
  </a>
  <a href="#/cal" data-tab="cal">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Upcoming</span><b class="tab-badge" id="badge-cal"></b>
  </a>
  <a href="#/settings" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    <span>Settings</span>
  </a>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" hidden></div>
<div id="lightbox" hidden></div>

<script src="app.js"></script>
</body>
</html>
